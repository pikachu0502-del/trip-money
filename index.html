<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅遊分帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'system-ui', 'sans-serif'] },
          colors: {
            // 主色：霧藍 #527C9B（小字請用 600 以上以符合 AA）
            blue:    { 50:'#EEF3F7', 100:'#DCE6EE', 200:'#BCCFDD', 300:'#93B0C6', 400:'#6A92B0', 500:'#527C9B', 600:'#456A86', 700:'#385671', 800:'#2C445A', 900:'#22364A' },
            // 中性：冷灰藍，文字主色 #293C4E
            gray:    { 50:'#EEF1F4', 100:'#E6EAEE', 200:'#DFE3E8', 300:'#8A97A5', 400:'#627284', 500:'#556576', 600:'#455565', 700:'#34475A', 800:'#293C4E', 900:'#1C2B3A' },
            red:     { 50:'#F8ECEC', 100:'#F0D8D9', 200:'#E4BCBE', 300:'#D99A9D', 400:'#C96E73', 500:'#B5545A', 600:'#984449', 700:'#7B363A' },
            green:   { 50:'#E8F2F0', 100:'#D2E6E2', 200:'#ABD1CA', 300:'#7FB8AE', 400:'#4E9C90', 500:'#2F7F73', 600:'#26685E', 700:'#1E524A' },
            emerald: { 50:'#E8F2F0', 100:'#D2E6E2', 200:'#ABD1CA', 300:'#7FB8AE', 400:'#4E9C90', 500:'#2F7F73', 600:'#26685E', 700:'#1E524A' },
            sky:     { 50:'#E9F1F3', 100:'#D3E3E8', 200:'#AECBD4', 300:'#84AFBD', 400:'#5A93A6', 500:'#3F7A8D', 600:'#336475', 700:'#284F5D' },
            orange:  { 50:'#F8EEDF', 100:'#F2E2CC', 200:'#E6CBA4', 300:'#D7AE76', 400:'#C58B42', 500:'#9C6E33', 600:'#7E5828' },
            amber:   { 50:'#F8EEDF', 100:'#F2E2CC', 200:'#E6CBA4', 300:'#D7AE76', 400:'#C58B42', 500:'#9C6E33', 600:'#7E5828' },
            pink:    { 50:'#F4EDF2', 100:'#E9DAE4', 200:'#D7BCCD', 300:'#C49BB4', 400:'#B0789A', 500:'#9A5F83', 600:'#7E4C6B' }
          },
          borderRadius: { lg:'0.75rem', xl:'1.1rem', '2xl':'1.5rem', '3xl':'2rem' },
          boxShadow: {
            sm: '0 1px 2px 0 rgba(41,60,78,0.05)',
            DEFAULT: '0 1px 3px 0 rgba(41,60,78,0.07)',
            md: '0 6px 16px -4px rgba(41,60,78,0.10)',
            lg: '0 12px 28px -6px rgba(41,60,78,0.12)',
            xl: '0 20px 40px -10px rgba(41,60,78,0.14)',
            '2xl': '0 28px 56px -14px rgba(41,60,78,0.18)'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: "Zen Maru Gothic", "Noto Sans TC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: .01em; }
    input, select, textarea, button { font-family: inherit; }
    h1, h2, h3 { text-wrap: pretty; }
    .modal { display: none; align-items: center; justify-content: center; position: fixed; inset: 0; background: rgba(29,44,59,0.38); z-index: 50; backdrop-filter: blur(5px); padding: 1rem; }
    .modal.active { display: flex; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #C9D0D8; border-radius: 10px; }
    .loading-overlay { display: none; }
    .loading-overlay.active { display: flex; position: absolute; inset: 0; background: rgba(247,248,250,0.82); align-items: center; justify-content: center; z-index: 20; border-radius: 1.1rem; }
    [x-hidden] { display: none !important; }
    .pagetab, #currentTripName, .listtab { white-space: nowrap; }
    :root { --tm-bg:#EDEFF2; --tm-card:#F7F8FA; --tm-primary:#527C9B; --tm-primary-ink:#456A86; --tm-primary-light:#E3EBF2; --tm-text:#293C4E; --tm-muted:#556576; --tm-border:#DFE3E8; --tm-success:#2F7F73; --tm-warning:#C58B42; --tm-error:#B5545A; }
    a { color: var(--tm-primary-ink); }
    a:hover { color: var(--tm-primary); }
    /* 卡片：帶灰的白，減少純白刺激 */
    .bg-white { background-color: var(--tm-card) !important; }
    .bg-white\/95 { background-color: rgba(247,248,250,.95) !important; }
    /* 卡片內的輸入框保持純白以區分層次 */
    input:not([type=checkbox]):not([type=radio]), select, textarea { color: var(--tm-text); }
    input.bg-gray-50, select.bg-gray-50, textarea.bg-gray-50 { background-color: #FFFFFF !important; }
    ::placeholder { color: #8A97A5; }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
  </style>
</head>
<body class="bg-[#EDEFF2] text-[#293C4E] font-bold min-h-screen">

  <div id="mainApp" class="max-w-[480px] mx-auto px-4 pt-2 pb-28" x-hidden>
    <!-- Header (sticky) -->
    <div class="sticky top-0 z-30 -mx-4 px-4 py-2.5 bg-[#EDEFF2]/90 backdrop-blur mb-4 flex justify-center">
      <button onclick="window.openModal('tripModal')" title="更換帳本" class="flex items-center gap-2 text-[#527C9B] hover:bg-blue-50 px-4 py-2 rounded-full border border-blue-100 transition-all bg-white shadow-sm">
        <i data-lucide="folder-open" class="w-4 h-4"></i>
        <span id="currentTripName" class="text-sm leading-none">載入中...</span>
        <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-blue-300"></i>
      </button>
    </div>

    <!-- 首頁目次 -->
    <div id="pageHome" x-hidden class="space-y-4 text-[#293C4E]">
      <div class="flex items-start justify-between gap-3 px-1">
        <div class="min-w-0">
          <div class="text-[10px] font-bold tracking-wider text-[#556576]">TRIP MONEY / MY TRAVEL</div>
          <div id="homeDest" class="text-2xl font-black truncate">—</div>
          <div id="homeDates" class="text-xs font-bold text-[#556576] mt-0.5">—</div>
        </div>
        <button onclick="window.openTripSettings()" title="旅程設定" class="shrink-0 w-11 h-11 rounded-full bg-white shadow-[0_1px_3px_rgba(41,60,78,.08)] flex items-center justify-center text-[#527C9B] hover:bg-[#E3EBF2]"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i></button>
      </div>
      <div class="bg-white rounded-[20px] shadow-[0_1px_3px_rgba(41,60,78,.06)] p-5">
        <div class="flex items-start justify-between gap-3 pb-4 border-b border-[#E3E7EC]">
          <div id="homeCountdown" class="min-w-0"></div>
          <div id="homeWeather" class="text-right shrink-0"></div>
        </div>
        <button onclick="window.setPage('list')" class="w-full flex items-center justify-between pt-4 text-sm font-bold">
          <span class="text-[#556576]">旅程準備<span id="homePrep" class="ml-2 text-[#627284]"></span></span>
          <span class="flex items-center gap-0.5 text-[#527C9B]">檢視待辦<i data-lucide="chevron-right" class="w-4 h-4"></i></span>
        </button>
      </div>
      <div class="flex items-center justify-between px-1 pt-1">
        <h2 class="text-base font-black">旅遊行程</h2>
        <button onclick="window.setPage('itin')" class="flex items-center gap-0.5 text-sm font-bold text-[#527C9B]">全部行程<i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>
      <div id="homeDays"></div>
      <div id="homeDaySummary"></div>
      <div id="homeLodging"></div>
      <div id="homeTiles" class="grid grid-cols-3 gap-3"></div>
    </div>

    <div id="tripContent" x-hidden class="space-y-5 text-[#293C4E]">
      <div class="bg-white rounded-[20px] shadow-[0_1px_3px_rgba(41,60,78,.06)] p-5 space-y-4">
        <div>
          <div class="text-xs font-bold text-[#556576]">旅行總支出</div>
          <div id="recTotal" class="text-[32px] leading-tight font-black tracking-tight mt-1">NT$ 0</div>
          <div id="recTotalSub" class="text-[11px] font-bold text-[#556576] mt-0.5"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl bg-[#E3EBF2] p-3.5 min-w-0">
            <label class="flex items-center gap-1 text-xs font-bold text-[#527C9B]"><select id="recMe" onchange="window.setRecMe(this.value)" title="選擇我是誰" class="bg-transparent outline-none cursor-pointer font-bold max-w-[6rem] truncate"></select><span class="shrink-0">的應付</span></label>
            <div id="recMine" class="text-lg font-black mt-1 truncate">NT$ 0</div>
          </div>
          <button onclick="window.setPage('map')" class="rounded-2xl bg-[#F8EEDF] p-3.5 text-left min-w-0">
            <div class="text-xs font-bold text-[#8E5F22]">待結算</div>
            <div id="recPending" class="text-lg font-black mt-1 truncate">NT$ 0</div>
          </button>
        </div>
        <button onclick="window.toggleRecMembers()" class="w-full flex items-center justify-between text-sm font-bold">
          <span class="flex items-center gap-2 text-[#556576]"><i data-lucide="users" class="w-4 h-4"></i><span id="recPeopleCount">0 位旅伴</span></span>
          <span class="flex items-center gap-0.5 text-[#527C9B]">管理成員<i id="recMembersChev" data-lucide="chevron-right" class="w-4 h-4 transition-transform"></i></span>
        </button>
        <div id="recMembers" x-hidden class="pt-4 border-t border-[#E3E7EC] space-y-3">
          <div id="peopleList" class="flex flex-wrap gap-2"></div>
          <div class="flex gap-2">
            <input id="newPersonInput" type="text" placeholder="新成員名稱" onkeydown="if(event.key==='Enter')window.addPerson()" class="flex-1 min-w-0 border border-[#DFE3E8] rounded-xl px-3 py-2 text-sm outline-none focus:border-[#527C9B] bg-[#EEF1F4] font-bold" />
            <button onclick="window.addPerson()" title="新增成員" class="w-10 rounded-xl border border-[#DFE3E8] text-[#527C9B] hover:bg-[#E3EBF2] flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4"></i></button>
          </div>
          <button onclick="window.openModal('ratesModal')" class="text-xs font-bold text-[#527C9B] flex items-center gap-1"><i data-lucide="settings-2" class="w-3.5 h-3.5"></i>匯率管理（總額換算依此匯率）</button>
        </div>
      </div>
      <div class="flex items-center justify-between px-1">
        <h2 class="text-base font-black">支出紀錄</h2>
        <div class="flex items-center gap-2">
          <span id="expenseCount" class="text-[11px] font-bold text-[#556576]">共 0 筆</span>
          <select id="monthFilter" onchange="window.setMonthFilter(this.value)" title="月份篩選" class="bg-white rounded-xl px-3 py-1.5 text-xs font-bold outline-none cursor-pointer shadow-[0_1px_2px_rgba(41,60,78,.05)]"></select>
        </div>
      </div>
      <div id="expenseList" class="space-y-3"></div>
    </div>

    <!-- 航班頁面 -->
    <div id="flightsContent" x-hidden class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-6 px-1">
        <div>
          <h1 class="text-2xl font-black text-gray-700">航班</h1>
          <p id="flightsSubtitle" class="text-sm text-gray-400 font-bold mt-1"></p>
        </div>
        
      </div>
      <div id="flightsList" class="space-y-5"></div>
    </div>

    <!-- 行程頁面 -->
    <div id="pageItinerary" x-hidden>
      <div id="itinCountdown" class="mb-5"></div>
      <div id="itineraryList" class="space-y-6"></div>
    </div>

    <!-- 結算頁面 -->
    <div id="pageMap" x-hidden class="space-y-5">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#DFE3E8]">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2 text-gray-500"><i data-lucide="credit-card" class="w-4 h-4"></i><h2 class="font-black">結算轉帳</h2></div>
          <select id="settlementCurrency" onchange="window.refreshUI()" title="結算幣別" class="bg-gray-50 border border-gray-100 text-xs px-2 py-1 rounded-md font-bold outline-none cursor-pointer"></select>
        </div>
        <div id="transfersList" class="space-y-2"></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#DFE3E8]">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2 text-gray-500"><i data-lucide="file-text" class="w-4 h-4"></i><h2 class="font-black">總額彙整</h2></div>
          <select id="summaryCurrency" onchange="window.refreshUI()" title="彙整幣別" class="bg-gray-50 border border-gray-100 text-xs px-2 py-1 rounded-md font-bold outline-none cursor-pointer"></select>
        </div>
        <div id="summaryList" class="space-y-4"></div>
      </div>
    </div>

    <!-- 清單頁面 -->
    <div id="pageLists" x-hidden class="max-w-2xl mx-auto">
      <div class="flex gap-2 mb-5">
        <button id="listTabWish" onclick="window.setListType('wish')" class="listtab flex-1 px-4 py-2.5 rounded-lg text-sm font-black flex items-center justify-center gap-1.5 transition-all"><i data-lucide="sparkles" class="w-4 h-4"></i>願望清單</button>
        <button id="listTabBuy" onclick="window.setListType('buy')" class="listtab flex-1 px-4 py-2.5 rounded-lg text-sm font-black flex items-center justify-center gap-1.5 transition-all"><i data-lucide="shopping-bag" class="w-4 h-4"></i>必買清單</button>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-[#DFE3E8] p-4 mb-4">
        <div class="flex gap-2">
          <input id="newListInput" type="text" placeholder="新增項目…" onkeydown="if(event.key==='Enter')window.addListItem()" class="flex-1 border border-gray-200 rounded-lg px-3 py-2.5 text-sm bg-gray-50 font-bold outline-none focus:border-blue-400" />
          <select id="newListMember" title="誰的" class="border border-gray-200 rounded-lg px-2 text-xs bg-gray-50 font-bold outline-none cursor-pointer max-w-[90px]"></select>
          <button onclick="window.addListItem()" title="新增" class="bg-[#527C9B] text-white px-4 rounded-lg hover:bg-blue-600 shrink-0"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div id="listProgress" class="mb-3"></div>
      <div id="listItems" class="space-y-2"></div>
    </div>

    <!-- 匯率頁面 -->
    <div id="pageRates" x-hidden class="max-w-lg mx-auto space-y-5">
      <div class="bg-white rounded-2xl shadow-sm border border-[#DFE3E8] p-5 space-y-4">
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2 text-gray-500 mr-auto"><i data-lucide="calculator" class="w-4 h-4"></i><h2 class="font-black">匯率計算機</h2></div>
          <select id="convFrom" onchange="window.calcRender()" title="輸入幣別" class="border border-[#DFE3E8] rounded-lg px-2 py-1.5 bg-[#EEF1F4] font-black text-sm outline-none cursor-pointer"></select>
          <button onclick="window.calcSwap()" title="交換幣別" class="w-8 h-8 rounded-full flex items-center justify-center text-[#527C9B] hover:bg-[#E3EBF2]"><i data-lucide="arrow-left-right" class="w-4 h-4"></i></button>
          <select id="convTo" onchange="window.calcRender()" title="換算幣別" class="border border-[#DFE3E8] rounded-lg px-2 py-1.5 bg-[#EEF1F4] font-black text-sm outline-none cursor-pointer"></select>
        </div>
        <div class="rounded-2xl bg-[#EEF1F4] border border-[#DFE3E8] px-4 py-4 text-right space-y-1">
          <div id="calcExpr" class="text-sm font-bold text-[#556576] min-h-[1.25rem] break-all"></div>
          <div class="flex items-baseline justify-end gap-2"><span id="calcValue" class="text-4xl font-black text-[#293C4E] tracking-tight break-all">0</span><span id="calcFromCode" class="text-sm font-black text-[#556576]"></span></div>
          <div class="flex items-baseline justify-end gap-2 pt-1 border-t border-[#DFE3E8]"><span class="text-sm font-bold text-[#556576]">≈</span><span id="calcResult" class="text-2xl font-black text-[#527C9B] tracking-tight break-all">—</span><span id="calcToCode" class="text-sm font-black text-[#527C9B]"></span></div>
          <div id="calcRateLine" class="text-[11px] font-bold text-[#556576]"></div>
        </div>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="window.calcKey('C')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#F8EEDF] text-[#8E5F22] hover:bg-[#F2E2CC]">C</button><button onclick="window.calcKey('back')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#E4E9EF] text-[#3F5A70] hover:bg-[#D9E0E7]"><i data-lucide="delete" class="w-5 h-5 mx-auto"></i></button><button onclick="window.calcKey('*')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#E4E9EF] text-[#3F5A70] hover:bg-[#D9E0E7]">×</button><button onclick="window.calcKey('/')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#E4E9EF] text-[#3F5A70] hover:bg-[#D9E0E7]">÷</button>
          <button onclick="window.calcKey('7')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">7</button><button onclick="window.calcKey('8')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">8</button><button onclick="window.calcKey('9')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">9</button><button onclick="window.calcKey('-')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#E4E9EF] text-[#3F5A70] hover:bg-[#D9E0E7]">−</button>
          <button onclick="window.calcKey('4')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">4</button><button onclick="window.calcKey('5')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">5</button><button onclick="window.calcKey('6')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">6</button><button onclick="window.calcKey('+')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#E4E9EF] text-[#3F5A70] hover:bg-[#D9E0E7]">+</button>
          <button onclick="window.calcKey('1')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">1</button><button onclick="window.calcKey('2')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">2</button><button onclick="window.calcKey('3')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">3</button><button onclick="window.calcKey('=')" class="row-span-2 rounded-2xl text-2xl font-black bg-[#527C9B] text-white hover:bg-[#456A86] active:scale-95 transition-transform">=</button>
          <button onclick="window.calcKey('00')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">00</button><button onclick="window.calcKey('0')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">0</button><button onclick="window.calcKey('.')" class="h-14 rounded-2xl text-xl font-black active:scale-95 transition-transform bg-[#EEF1F4] text-[#293C4E] hover:bg-[#E3EBF2]">.</button>
        </div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-[#DFE3E8] p-5">
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-2 text-gray-500"><i data-lucide="trending-up" class="w-4 h-4"></i><h2 class="font-black">即時匯率</h2></div>
          <button onclick="window.loadLiveRates(true)" title="重新整理" class="text-[#527C9B] hover:text-[#456A86] flex items-center gap-1 text-xs font-bold"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>更新</button>
        </div>
        <p id="rateUpdated" class="text-[10px] text-gray-400 font-bold mb-3">載入中…</p>

  <!-- 旅程設定 Modal -->
  <div id="tripSettingsModal" class="modal !items-start sm:!items-center overflow-y-auto">

  <div id="lodgingModal" class="modal !items-start sm:!items-center overflow-y-auto">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl my-4 overflow-hidden flex flex-col max-h-[94vh]">
      <div class="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDwhrvO9igpNTDPkGZeZ8ocYDrNnVENk8o",
      authDomain: "money-89a0e.firebaseapp.com",
      databaseURL: "https://money-89a0e-default-rtdb.firebaseio.com",
      projectId: "money-89a0e",
      storageBucket: "money-89a0e.firebasestorage.app",
      messagingSenderId: "41518797533",
      appId: "1:41518797533:web:943b9330b0234de59f0134",
      measurementId: "G-SLTTYB5L2H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "money-89a0e-trip-web";

    // ===== Gemini (收據辨識) — 填入金鑰才會啟用，否則自動略過 =====
    const GEMINI_API_KEY = "";
    const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

    const CURRENCIES = [
      { code: 'TWD', symbol: '$' },
      { code: 'JPY', symbol: '¥' },
      { code: 'KRW', symbol: '₩' },
      { code: 'EUR', symbol: '€' },
      { code: 'USD', symbol: '$' }
    ];
    const DEFAULT_RATES = { TWD: 1, JPY: 0.21, KRW: 0.024, EUR: 34.5, USD: 32.0 };
    const CATEGORIES = ['住宿', '餐飲', '交通', '購物', '娛樂', '雜費'];
    const PAYMENT_METHODS = ['現金', '信用卡', '行動支付'];
    const SPLIT_METHODS = ['平分', '代墊', '請客', '自訂金額'];

    // 行程類型 → 顏色 / 圖示 / 地圖圖層
    const ITIN_TYPES = {
      '景點': { color: '#B8873F', icon: 'camera', layer: 'sight' },
      '餐廳': { color: '#C0705F', icon: 'utensils', layer: 'food' },
      '交通': { color: '#3F8A9E', icon: 'train-front', layer: 'other' },
      '住宿': { color: '#7A6FA8', icon: 'bed-double', layer: 'stay' },
      '購物': { color: '#B0678A', icon: 'shopping-bag', layer: 'other' },
      '其他': { color: '#6E7C8A', icon: 'map-pin', layer: 'other' }
    };
    const LODGE_COLORS = ['#5E5491', '#336475', '#456A86', '#8E5F22', '#8E4F6E', '#26685E'];
    // 舊資料可能存有高飽和色；不在色盤內就依序號改用色盤色（白字皆 ≥ 4.5:1）
    const lodgeColor = (l, i) => LODGE_COLORS.includes(l && l.color) ? l.color : LODGE_COLORS[(i || 0) % LODGE_COLORS.length];
    const PAGE_MAP = {
      home:   { el: 'pageHome',        tab: 'tab_home',   add: null },
      trip:   { el: 'tripContent',     tab: 'tab_trip',   add: 'addExpenseBtn' },
      flight: { el: 'flightsContent',  tab: 'tab_flight', add: 'addFlightBtn' },
      itin:   { el: 'pageItinerary',   tab: 'tab_itin',   add: 'addItinBtn' },
      map:    { el: 'pageMap',         tab: 'tab_map',    add: null },
      list:   { el: 'pageLists',       tab: 'tab_list',   add: null },
      rate:   { el: 'pageRates',       tab: 'tab_rate',   add: null }
    };
    // 每種模式可用的頁面
    const MODE_PAGES = {
      simple: ['trip', 'map'],
      travel: ['home', 'trip', 'flight', 'itin', 'map', 'list', 'rate']
    };

    // ===== state =====
    let isAuthed = false;
    let activeTripId = null;
    let trips = [];
    let people = [];
    let expenses = [];
    let rates = { ...DEFAULT_RATES };
    let expensesCache = {};
    let flights = [];
    let flightsCache = {};
    let tripMeta = {};
    let itinerary = [];
    let itineraryCache = {};
    let lists = [];
    let listsCache = {};
    let editingItinId = null;
    let listType = 'wish';
    let lodgingDraft = [];
    let liveRates = null;
    let mapLayerOn = {};
    let mapDate = 'all';
    let tripMode = 'travel';
    let pendingDefaultPage = false;
    let metaModeDraft = 'travel';
    // form state
    let editingId = null;
    let participants = [];
    let customAmounts = {};
    let previewUrl = null;
    let expandedTransferKey = null;
    let editingTripId = null;
    let selectedMonth = 'all';
    let currentView = 'list';
    let currentPage = 'trip';
    let editingFlightId = null;
    let map = null;
    let mapMarkers = [];
    // listeners
    let unsubSettings = null;
    let unsubExpenses = null;
    let unsubFlights = null;
    let unsubItin = null;
    let unsubLists = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icons = () => window.lucide && window.lucide.createIcons();

    function fillCurrencySelect(el, val) {
      el.innerHTML = CURRENCIES.map(c => `<option value="${c.code}">${c.code}</option>`).join('');
      el.value = val;
    }

    function init() {
      // populate static selects
      fillCurrencySelect($('settlementCurrency'), 'TWD');
      fillCurrencySelect($('summaryCurrency'), 'TWD');

      signInAnonymously(auth).catch(err => {
        console.error('驗證失敗', err);
        $('currentTripName').innerText = '登入失敗';
      });
      onAuthStateChanged(auth, (user) => {
        if (!user) return;
        isAuthed = true;
        const tripsRef = collection(db, 'artifacts', appId, 'public', 'data', 'trips_list');
        onSnapshot(tripsRef, (snap) => {
          trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderTrips();
          // 起始畫面：尚未選帳本時，彈出帳本選擇頁（當作 landing）
          if (!activeTripId) {
            updateTripModalChrome();
            window.openModal('tripModal');
          }
        });
      });
    }

    function updateTripModalChrome() {
      const hasTrip = !!activeTripId;
      $('tripModalTitle').innerText = hasTrip ? '更換帳本' : '選擇帳本';
      $('tripModalClose').style.display = hasTrip ? '' : 'none';
      $('tripModalHint').style.display = hasTrip ? 'none' : '';
    }

    window.switchTrip = (id) => {
      if (!isAuthed) return;
      activeTripId = id;
      const trip = trips.find(t => t.id === id);
      $('currentTripName').innerText = trip ? trip.name : '未選取帳本';
      // 進入帳本內部頁面
      $('mainApp').removeAttribute('x-hidden');
      updateTripModalChrome();
      pendingDefaultPage = true;
      renderTrips();

      if (unsubSettings) unsubSettings();
      if (unsubExpenses) unsubExpenses();
      if (unsubFlights) unsubFlights();
      if (unsubItin) unsubItin();
      if (unsubLists) unsubLists();

      const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'trip_settings', activeTripId);
      unsubSettings = onSnapshot(settingsRef, (d) => {
        if (d.exists()) {
          const data = d.data();
          people = Array.isArray(data.people) ? data.people : [];
          rates = data.rates ? { ...DEFAULT_RATES, ...data.rates } : { ...DEFAULT_RATES };
          tripMeta = data.meta || {};
        } else {
          people = []; rates = { ...DEFAULT_RATES }; tripMeta = {};
          setDoc(settingsRef, { people: [], rates: DEFAULT_RATES });
        }
        tripMode = tripMeta.mode || 'travel';
        applyMode();
        renderPeople();
        window.refreshUI();
        window.renderFlights();
        renderHome();
        renderItinerary();
        fetchWeather();
      });

      const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', `expenses_${activeTripId}`);
      unsubExpenses = onSnapshot(expensesRef, (snap) => {
        expensesCache = {};
        expenses = snap.docs.map(d => {
          const data = { dbId: d.id, ...d.data() };
          expensesCache[d.id] = data;
          return data;
        });
        expenses.sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : (b.created_at || 0) - (a.created_at || 0)));
        window.refreshUI();
        if (currentPage === 'itin') renderItinerary();
        if (currentPage === 'home') renderHome();
      });

      const flightsRef = collection(db, 'artifacts', appId, 'public', 'data', `flights_${activeTripId}`);
      unsubFlights = onSnapshot(flightsRef, (snap) => {
        flightsCache = {};
        flights = snap.docs.map(d => {
          const data = { dbId: d.id, ...d.data() };
          flightsCache[d.id] = data;
          return data;
        });
        flights.sort((a, b) => (a.date > b.date ? 1 : a.date < b.date ? -1 : (a.depTime > b.depTime ? 1 : -1)));
        window.renderFlights();
        renderHome();
        renderItinerary();
      });

      const itinRef = collection(db, 'artifacts', appId, 'public', 'data', `itinerary_${activeTripId}`);
      unsubItin = onSnapshot(itinRef, (snap) => {
        itineraryCache = {};
        itinerary = snap.docs.map(d => { const data = { dbId: d.id, ...d.data() }; itineraryCache[d.id] = data; return data; });
        itinerary.sort((a, b) => (a.date > b.date ? 1 : a.date < b.date ? -1 : ((a.time || '') > (b.time || '') ? 1 : -1)));
        renderItinerary();
        renderHome();
        if (currentPage === 'map') { renderSummary(); renderSettlement(); }
      });

      const listsRef = collection(db, 'artifacts', appId, 'public', 'data', `lists_${activeTripId}`);
      unsubLists = onSnapshot(listsRef, (snap) => {
        listsCache = {};
        lists = snap.docs.map(d => { const data = { dbId: d.id, ...d.data() }; listsCache[d.id] = data; return data; });
        lists.sort((a, b) => (a.created_at || 0) - (b.created_at || 0));
        renderLists();
        renderHome();
      });
    };

    window.refreshUI = () => {
      renderExpenses();
      renderSummary();
      renderSettlement();
      icons();
    };

    // ===== 頁面切換 =====
    const TAB_ON = 'navbtn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[#527C9B] relative after:absolute after:top-0 after:left-1/2 after:-translate-x-1/2 after:w-6 after:h-[3px] after:rounded-b after:bg-[#527C9B]';
    const TAB_OFF = 'navbtn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[#627284]';
    window.setPage = (p) => {
      if (!PAGE_MAP[p]) p = 'home';
      currentPage = p;
      Object.entries(PAGE_MAP).forEach(([key, cfg]) => {
        $(cfg.el).toggleAttribute('x-hidden', key !== p);
        $(cfg.tab).className = key === p ? TAB_ON : TAB_OFF;
        if (cfg.add) $(cfg.add).toggleAttribute('x-hidden', !(cfg.add && key === p));
      });
      if (p === 'home') renderHome();
      else if (p === 'flight') window.renderFlights();
      else if (p === 'itin') renderItinerary();
      else if (p === 'map') { renderSummary(); renderSettlement(); }
      else if (p === 'list') renderLists();
      else if (p === 'rate') renderRatesPage();
      icons();
    };

    // 依帳本模式顯示可用頁面
    function applyMode() {
      const allowed = MODE_PAGES[tripMode] || MODE_PAGES.travel;
      Object.entries(PAGE_MAP).forEach(([key, cfg]) => {
        $(cfg.tab).toggleAttribute('x-hidden', !allowed.includes(key));
      });
      if (pendingDefaultPage) {
        pendingDefaultPage = false;
        window.setPage(tripMode === 'simple' ? 'trip' : 'home');
      } else if (!allowed.includes(currentPage)) {
        window.setPage(allowed[0]);
      }
    }

    // ===== 航班 =====
    function calcDuration(dep, arr) {
      if (!dep || !arr) return '';
      const [dh, dm] = dep.split(':').map(Number);
      const [ah, am] = arr.split(':').map(Number);
      let mins = (ah * 60 + am) - (dh * 60 + dm);
      if (mins < 0) mins += 24 * 60;
      const h = Math.floor(mins / 60), m = mins % 60;
      return `${h}h${m ? ' ' + m + 'min' : ''}`;
    }
    const WD = ['日', '一', '二', '三', '四', '五', '六'];
    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d + 'T00:00:00');
      return `${dt.getFullYear()}/${dt.getMonth() + 1}/${dt.getDate()} ${WD[dt.getDay()]}`;
    }

    window.renderFlights = () => {
      const list = uniqueFlights();
      $('flightsSubtitle').innerText = list.length ? `共 ${list.length} 段航班` : '尚無航班紀錄';

      $('flightsList').innerHTML = list.length ? list.map(f => {
        const dur = f.duration || calcDuration(f.depTime, f.arrTime);
        return `<div onclick="window.editFlight('${f.dbId}')" class="bg-white rounded-2xl shadow-sm border border-[#DFE3E8] p-6 cursor-pointer hover:shadow-md hover:border-blue-200 transition-all">
          <div class="flex justify-between items-center mb-5">
            <div class="flex items-center gap-2 text-sm font-black text-[#527C9B]">
              <span>${esc(f.number || '航班')}</span>
              <span class="text-gray-300">·</span>
              <span class="text-gray-400 font-bold">${esc(f.direction || '')}</span>
            </div>
            <span class="text-sm text-gray-400 font-bold">${esc(fmtDate(f.date))}</span>
          </div>
          <div class="flex items-center justify-between gap-3">
            <div class="text-4xl font-black text-gray-800 tracking-tight">${esc(f.fromCode || '—')}</div>
            <div class="flex-1 flex flex-col items-center">
              <span class="text-[11px] text-gray-400 font-bold mb-1">${esc(dur)}</span>
              <div class="w-full flex items-center gap-1 text-blue-300">
                <div class="flex-1 border-t border-dashed border-gray-200"></div>
                <i data-lucide="plane" class="w-4 h-4 text-blue-400"></i>
                <div class="flex-1 border-t border-dashed border-gray-200"></div>
              </div>
            </div>
            <div class="text-4xl font-black text-gray-800 tracking-tight">${esc(f.toCode || '—')}</div>
          </div>
          <div class="flex justify-between items-baseline mt-2">
            <div class="text-2xl font-black text-gray-700">${esc(f.depTime || '--:--')}</div>
            <div class="text-2xl font-black text-gray-700">${esc(f.arrTime || '--:--')}</div>
          </div>
          <div class="flex justify-between text-sm text-gray-400 font-bold mt-1">
            <span>${esc(f.fromName || '')}</span>
            <span>${esc(f.toName || '')}</span>
          </div>
          ${(f.airline || f.note || f.pnr) ? `<div class="flex items-center gap-3 mt-4 pt-4 border-t border-gray-50 text-sm text-gray-400 font-bold flex-wrap">
            ${f.airline ? `<span class="text-gray-500">${esc(f.airline)}</span>` : ''}
            ${f.pnr ? `<span class="bg-gray-100 text-gray-500 text-[11px] px-2 py-0.5 rounded font-black tracking-wider">${esc(f.pnr)}</span>` : ''}
            ${f.note ? `<span>${esc(f.note)}</span>` : ''}
          </div>` : ''}
        </div>`;
      }).join('') : `<div class="text-center py-20 text-gray-300 font-bold bg-white rounded-2xl border border-gray-50"><i data-lucide="plane" class="w-10 h-10 mx-auto mb-2 opacity-20"></i><p>尚無航班，點右上「新增航班」</p></div>`;
      icons();
    };

    // 同一班機（日期＋航班編號＋起訖）只顯示一次；舊資料可能依成員重複建立
    function uniqueFlights() {
      const seen = new Set();
      return flights.filter(f => {
        const k = [f.date, (f.number || '').replace(/\s/g, '').toUpperCase(), f.fromCode, f.toCode, f.depTime].join('|');
        if (seen.has(k)) return false; seen.add(k); return true;
      }).sort((a, b) => ((a.date || '') + (a.depTime || '')).localeCompare((b.date || '') + (b.depTime || '')));
    }

    window.openAddFlight = () => {
      if (!activeTripId) { alert('請先選擇帳本'); return; }
      editingFlightId = null;
      $('flightModalTitle').innerText = '新增航班';
      $('flightDeleteBtn').setAttribute('x-hidden', '');
      $('flDirection').value = '去程';
      $('flAirline').value = '';
      $('flNumber').value = '';
      $('flDate').value = selectedItinDate || tripMeta.startDate || todayStr();
      $('flFromCode').value = ''; $('flFromName').value = ''; $('flDepTime').value = '';
      $('flToCode').value = ''; $('flToName').value = ''; $('flArrTime').value = '';
      $('flDuration').value = ''; $('flPnr').value = ''; $('flNote').value = '';
      window.openModal('addFlightModal');
    };

    window.editFlight = (id) => {
      const f = flightsCache[id];
      if (!f) return;
      editingFlightId = id;
      $('flightModalTitle').innerText = '編輯航班';
      $('flightDeleteBtn').removeAttribute('x-hidden');
      $('flDirection').value = f.direction || '去程';
      $('flAirline').value = f.airline || '';
      $('flNumber').value = f.number || '';
      $('flDate').value = f.date || '';
      $('flFromCode').value = f.fromCode || ''; $('flFromName').value = f.fromName || ''; $('flDepTime').value = f.depTime || '';
      $('flToCode').value = f.toCode || ''; $('flToName').value = f.toName || ''; $('flArrTime').value = f.arrTime || '';
      $('flDuration').value = f.duration || ''; $('flPnr').value = f.pnr || ''; $('flNote').value = f.note || '';

    window.saveFlight = async () => {
      if (!isAuthed || !activeTripId) return;

      const fromCode = $('flFromCode').value.trim();
      const toCode = $('flToCode').value.trim();

      const btn = $('flightSaveBtn'); const loader = $('flightSaveLoader');
      btn.disabled = true; loader.classList.add('active');
      try {
        const col = collection(db, 'artifacts', appId, 'public', 'data', `flights_${activeTripId}`);
        const data = {
          direction: $('flDirection').value,
          airline: $('flAirline').value.trim(),
          number,
          date: $('flDate').value,
          fromCode, fromName: $('flFromName').value.trim(), depTime: $('flDepTime').value,
          toCode, toName: $('flToName').value.trim(), arrTime: $('flArrTime').value,
          duration: $('flDuration').value.trim(),
          pnr: $('flPnr').value.trim(),
          note: $('flNote').value.trim(),
          updated_at: serverTimestamp()
        };
        if (editingFlightId) await updateDoc(doc(col, editingFlightId), data);
        else await addDoc(col, data);

      } catch (err) {
        console.error('航班儲存失敗', err);
        alert('儲存失敗，請確認網路與 Firebase 權限');
      } finally {
        btn.disabled = false; loader.classList.remove('active');
      }
    };

    window.deleteFlight = async () => {
      if (!editingFlightId || !isAuthed) return;
      if (!confirm('確定刪除此航班？')) return;
      await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `flights_${activeTripId}`, editingFlightId));
      window.closeModal('addFlightModal');
    };

    // ===== 地圖（Leaflet + Nominatim）=====
    const CAT_COLOR = { '住宿': '#7A6FA8', '餐飲': '#C0705F', '交通': '#3F8A9E', '購物': '#B0678A', '娛樂': '#B8873F', '雜費': '#6E7C8A' };
    const geoCache = {};

    async function geocode(query) {
      const key = query.toLowerCase();
      if (geoCache[key]) return geoCache[key];
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
        const arr = await res.json();
        if (arr && arr.length) {
          const g = { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
          geoCache[key] = g;
          return g;
        }
      } catch (err) { console.warn('地點定位失敗', query, err); }
      return null;
    }

    const CAT_ICON = { '住宿':'bed-double', '餐飲':'utensils', '交通':'train-front', '購物':'shopping-bag', '娛樂':'camera', '雜費':'map-pin' };
    const ITIN2CAT = { '景點':'娛樂', '餐廳':'餐飲', '交通':'交通', '住宿':'住宿', '購物':'購物', '其他':'雜費' };

    function navBtn(lat, lng, name) {
      const q = name ? encodeURIComponent(name) : `${lat},${lng}`;
      const url = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
      return `<a href="${url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:#527C9B;color:#fff;font-weight:800;font-size:11px;padding:5px 10px;border-radius:8px;text-decoration:none">🧭 Google Maps 導航</a>`;
    }

    function collectMapPoints() {
      const pts = [];
      itinerary.forEach(it => {
        if (it.lat == null || it.lng == null || (it.lat === 0 && it.lng === 0)) return;
        const cat = ITIN2CAT[it.type] || '雜費';
        pts.push({ cat, date: it.date || '', lat: it.lat, lng: it.lng, title: it.title, sub: `行程 · ${it.type || ''}${it.time ? ' · ' + it.time : ''}`, loc: it.location });
      });
      expenses.forEach(e => {
        if (e.lat == null || e.lng == null || (e.lat === 0 && e.lng === 0)) return;
        const cat = CATEGORIES.includes(e.category) ? e.category : '雜費';
        pts.push({ cat, date: e.date || '', lat: e.lat, lng: e.lng, title: e.note, sub: `${e.category || ''} · ${e.currency} ${Math.round(e.amount).toLocaleString()}`, loc: e.location });
      });
      return pts;
    }

    function mapPointsForDate() {
      return collectMapPoints().filter(p => mapDate === 'all' || p.date === mapDate);
    }
    window.setMapDate = (v) => { mapDate = v; renderMap(); };
    function buildMapDateFilter() {
      const dates = [...new Set(collectMapPoints().map(p => p.date).filter(Boolean))].sort();
      if (mapDate !== 'all' && !dates.includes(mapDate)) mapDate = 'all';
      const sel = $('mapDateFilter');
      sel.innerHTML = `<option value="all">全部日期</option>` + dates.map(d => `<option value="${d}">${mdw(d)}</option>`).join('');
      sel.value = mapDate;
    }

    function renderLayerChips() {
      const counts = {};
      mapPointsForDate().forEach(p => { counts[p.cat] = (counts[p.cat] || 0) + 1; });
      $('mapLayerChips').innerHTML = CATEGORIES.map(cat => {
        const on = mapLayerOn[cat] !== false;
        const color = CAT_COLOR[cat] || '#6E7C8A';
        return `<button onclick="window.toggleLayer('${cat}')" class="flex items-center justify-center gap-1.5 px-2 py-2 rounded-lg text-xs font-black border transition-all ${on ? 'text-white shadow-sm' : 'bg-white text-gray-300 border-gray-100'}" style="${on ? `background:${color};border-color:${color}` : ''}">
          <i data-lucide="${CAT_ICON[cat]}" class="w-3 h-3"></i>${cat} <span class="opacity-70">${counts[cat] || 0}</span>
        </button>`;
      }).join('');
    }
    window.toggleLayer = (k) => { mapLayerOn[k] = mapLayerOn[k] === false; renderMap(); };

    // 從首頁住宿 → 跳到地圖並定位
    // 住宿 → 直接開啟 Google Maps（有座標用座標，否則用名稱搜尋）
    window.gotoLodging = (i) => {
      const l = (tripMeta.lodgings || [])[i];
      if (!l) return;
      const ok = typeof l.lat === 'number' && typeof l.lng === 'number' && !(l.lat === 0 && l.lng === 0);
      const q = ok ? `${l.lat},${l.lng}` : [l.name, tripMeta.destination].filter(Boolean).join(' ');
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank', 'noopener');
    };

    function renderMap() {
      if (!map) {
        map = L.map('mapView', { scrollWheelZoom: true }).setView([25.03, 121.56], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);
      }
      buildMapDateFilter();
      renderLayerChips();
      setTimeout(() => map.invalidateSize(), 60);
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];

      const pts = mapPointsForDate().filter(p => mapLayerOn[p.cat] !== false);
      if (!pts.length) {
        $('mapEmpty').innerText = '尚無帶座標的地點。新增支出並填「地點」，或在行程加入含地點的項目，即會自動定位。';
        icons(); return;
      }
      $('mapEmpty').innerText = `地圖上共 ${pts.length} 個地點・點圖釘看詳情與導航`;

      const bounds = [];
      pts.forEach(p => {
        const color = CAT_COLOR[p.cat] || '#6E7C8A';
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 9, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.9
        }).addTo(map);
        marker.bindPopup(`
          <div style="font-family:sans-serif;min-width:150px">
            <div style="font-weight:800;font-size:14px;margin-bottom:2px">${esc(p.title || '')}</div>
            <div style="color:${color};font-weight:700;font-size:11px">${esc(p.sub || '')}</div>
            ${p.loc ? `<div style="color:#8A97A5;font-size:11px;margin-top:3px">📍 ${esc(p.loc)}</div>` : ''}
            ${navBtn(p.lat, p.lng, p.loc)}
          </div>`);
        mapMarkers.push(marker);
        bounds.push([p.lat, p.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      icons();
      backfillCoords();
      backfillLodging();
    }

    // 尚未有座標、但有地點的舊資料：慢速補定位（1/秒）並寫回 Firebase
    let backfilling = false;
    async function backfillCoords() {
      if (backfilling || !activeTripId) return;
      const pendingExp = expenses.filter(e => e.location && (e.lat == null || e.lng == null));
      const pendingItin = itinerary.filter(e => e.location && (e.lat == null || e.lng == null));
      if (!pendingExp.length && !pendingItin.length) return;
      backfilling = true;
      try {
        for (const exp of pendingExp) {
          const geo = await geocode(exp.location);
          await new Promise(r => setTimeout(r, 1100));
          const patch = geo ? { lat: geo.lat, lng: geo.lng } : { lat: 0, lng: 0 };
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `expenses_${activeTripId}`, exp.dbId), patch);
        }
        for (const it of pendingItin) {
          const geo = await geocode(it.location);
          await new Promise(r => setTimeout(r, 1100));
          const patch = geo ? { lat: geo.lat, lng: geo.lng } : { lat: 0, lng: 0 };
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `itinerary_${activeTripId}`, it.dbId), patch);
        }
      } catch (err) { console.warn('補定位中斷', err); }
      finally { backfilling = false; }
    }

    // ===== 成員 =====
    function renderPeople() {
      $('peopleList').innerHTML = people.map((p, idx) => `
        <span class="bg-[#E6EAEE] border border-[#DFE3E8] px-3 py-1.5 rounded-lg text-sm flex items-center gap-2">
          ${esc(p)}
          <button onclick="window.removePerson(${idx})" title="刪除成員" class="text-red-300 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
        </span>`).join('') || `<span class="text-gray-300 text-sm">尚無成員</span>`;
      icons();
    }

    window.addPerson = async () => {
      const input = $('newPersonInput');
      const name = input.value.trim();
      if (name && activeTripId && isAuthed && !people.includes(name)) {
        const newPeople = [...people, name];
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trip_settings', activeTripId), { people: newPeople }, { merge: true });
        input.value = '';
      }
    };

    window.removePerson = async (idx) => {
      if (!activeTripId || !isAuthed) return;
      const newPeople = people.filter((_, i) => i !== idx);
      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trip_settings', activeTripId), { people: newPeople }, { merge: true });
    };

    // ===== 帳本 =====
    function renderTrips() {
      $('tripsContainer').innerHTML = trips.map(t => {
        if (editingTripId === t.id) {
          return `<div class="flex gap-2 items-center">
            <input id="editTripInput" value="${esc(t.name)}" onkeydown="if(event.key==='Enter')window.saveTripName('${t.id}')" class="flex-1 border-2 border-blue-400 rounded-xl px-4 py-2 text-sm outline-none font-bold" />
            <button onclick="window.saveTripName('${t.id}')" title="儲存" class="text-green-500 p-2"><i data-lucide="check" class="w-5 h-5"></i></button>
          </div>`;
        }
        const active = activeTripId === t.id;
        return `<div class="flex gap-2 items-center group">
          <button onclick="window.switchTrip('${t.id}'); window.closeModal('tripModal')" class="flex-1 text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between ${active ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-gray-50 hover:border-blue-200 hover:bg-gray-50'} font-bold">
            <span class="flex items-center gap-2"><span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full font-black ${t.mode === 'simple' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-600'}">${t.mode === 'simple' ? '記帳' : '旅遊'}</span>${esc(t.name)}</span>${active ? '<i data-lucide="chevron-right" class="w-4 h-4"></i>' : ''}
          </button>
          <div class="flex flex-col gap-1 opacity-60 sm:opacity-0 group-hover:opacity-100 transition-opacity">
            <button onclick="window.startEditTrip('${t.id}')" title="重新命名" class="p-1.5 text-gray-400 hover:text-blue-500"><i data-lucide="pencil" class="w-4 h-4"></i></button>
            <button onclick="window.deleteTrip('${t.id}')" title="刪除帳本" class="p-1.5 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>`;
      }).join('') || `<p class="text-gray-300 text-center py-4">尚無帳本，請在下方建立</p>`;
      icons();
    }

    window.startEditTrip = (id) => { editingTripId = id; renderTrips(); setTimeout(() => $('editTripInput')?.focus(), 30); };
    window.saveTripName = async (id) => {
      const v = $('editTripInput').value.trim();
      if (v) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trips_list', id), { name: v });
      editingTripId = null; renderTrips();
    };
    window.deleteTrip = async (id) => {
      if (!confirm('確定刪除此帳本？此動作無法復原。')) return;
      await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trips_list', id));
      if (activeTripId === id) {
        const remaining = trips.filter(t => t.id !== id);
        if (remaining.length > 0) switchTrip(remaining[0].id);
        else {
          activeTripId = null; people = []; expenses = [];
          $('currentTripName').innerText = '未選取帳本';
          $('mainApp').setAttribute('x-hidden', '');
          renderPeople(); window.refreshUI();
          updateTripModalChrome(); window.openModal('tripModal');
        }
      }
    };
    window.createTripMode = async (mode) => {
      if (!isAuthed) return;
      const input = $('newTripInput');
      const name = input.value.trim();
      if (!name) { alert('請先輸入帳本名稱'); return; }
      const d = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'trips_list'), { name, mode, created_at: Date.now() });
      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trip_settings', d.id), { people: [], rates: DEFAULT_RATES, meta: { mode } }, { merge: true });
      input.value = '';
      switchTrip(d.id);
      window.closeModal('tripModal');
      if (mode === 'travel') setTimeout(() => window.openTripSettings(), 400);
    };

    // ===== 匯率 =====
    function renderRates() {
      $('ratesList').innerHTML = CURRENCIES.filter(c => c.code !== 'TWD').map(c => `
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-600">1 ${c.code} (${c.symbol})</span>
          <div class="flex items-center gap-2">
            <input type="number" step="0.001" value="${rates[c.code]}" onchange="window.setRate('${c.code}', this.value)" class="w-24 text-right border-b border-blue-200 focus:border-blue-500 outline-none text-sm font-black py-1 bg-transparent" />
            <span class="text-xs text-gray-300">TWD</span>
          </div>
        </div>`).join('');
    }
    window.setRate = async (code, val) => {
      const newRates = { ...rates, [code]: parseFloat(val) || 0 };
      rates = newRates;
      if (activeTripId) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trip_settings', activeTripId), { rates: newRates }, { merge: true });
    };

    // ===== 支出明細 =====
    function renderExpenses() {
      // 可選月份（依日期 YYYY-MM）
      const months = [...new Set(expenses.map(e => (e.date || '').slice(0, 7)).filter(Boolean))].sort().reverse();
      if (selectedMonth !== 'all' && !months.includes(selectedMonth)) selectedMonth = 'all';
      const mf = $('monthFilter');
      mf.innerHTML = `<option value="all">全部月份</option>` + months.map(m => {
        const [y, mm] = m.split('-');
        return `<option value="${m}">${y} 年 ${parseInt(mm, 10)} 月</option>`;
      }).join('');
      mf.value = selectedMonth;

      const list = selectedMonth === 'all' ? expenses : expenses.filter(e => (e.date || '').slice(0, 7) === selectedMonth);
      $('expenseCount').innerText = selectedMonth === 'all' ? `共 ${expenses.length} 筆` : `${list.length} / ${expenses.length} 筆`;
      renderRecSummary(list);
      const groups = {};
      list.forEach(x => { (groups[x.date || '未填日期'] = groups[x.date || '未填日期'] || []).push(x); });
      const keys = Object.keys(groups).sort().reverse();
      const WDF = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayLabel = (d) => { if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d; const o = dObj(d); return `${o.getMonth() + 1}月${o.getDate()}日 · ${WDF[o.getDay()]}`; };
      const row = (x) => {
        const col = /^#[0-9a-f]{6}$/i.test(CAT_COLOR[x.category] || '') ? CAT_COLOR[x.category] : '#6E7C8A';
        const sym = curSym(x.currency);
        const amt = parseFloat(x.amount) || 0;
        const twd = amt * (rates[x.currency] || 1);
        return `<div onclick="window.editExpense('${x.dbId}')" class="flex items-center gap-3 min-h-[76px] py-3 cursor-pointer group">
          <div class="w-11 h-11 rounded-xl shrink-0 flex items-center justify-center overflow-hidden" style="background:${col}1F;color:${col}">
            ${x.previewUrl ? `<img src="${esc(x.previewUrl)}" alt="收據" onclick="event.stopPropagation();window.previewImage('${x.dbId}')" class="w-full h-full object-cover cursor-zoom-in" />` : `<i data-lucide="${CAT_ICON[x.category] || 'receipt'}" class="w-5 h-5"></i>`}
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-[15px] font-bold truncate">${esc(x.note || x.category || '未命名')}</div>
            <div class="text-xs font-bold text-[#556576] truncate mt-0.5">${esc(x.category || '')}${x.payer ? ' · ' + esc(x.payer) + ' 支付' : ''}</div>
            <div class="text-[10px] font-bold text-[#627284] truncate mt-0.5">${[x.paymentMethod || '現金', x.splitMethod, x.location].filter(Boolean).map(esc).join(' · ')}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-base font-black">${sym}${Math.round(amt).toLocaleString()}</div>
            ${x.currency && x.currency !== 'TWD' ? `<div class="text-[10px] font-bold text-[#627284]">${esc(x.currency)} · ≈ NT$${Math.round(twd).toLocaleString()}</div>` : ''}
          </div>
        </div>`;
      };
      $('expenseList').innerHTML = keys.length ? keys.map(k => `<div class="bg-white rounded-[20px] shadow-[0_1px_3px_rgba(41,60,78,.06)] px-4">
          <div class="flex items-center justify-between py-3 border-b border-[#E3E7EC]"><span class="text-sm font-bold">${esc(dayLabel(k))}</span><span class="text-xs font-bold text-[#556576]">${groups[k].length} 筆</span></div>
          <div class="divide-y divide-[#E3E7EC]">${groups[k].map(row).join('')}</div>
        </div>`).join('') : `<div class="text-center py-16 bg-white rounded-[20px] text-[#627284] font-bold"><i data-lucide="receipt" class="w-10 h-10 mx-auto mb-2 opacity-30"></i><p>${selectedMonth === 'all' ? '尚無支出紀錄' : '此月份無紀錄'}</p></div>`;
      icons();
    }

    const curSym = (c) => c === 'TWD' ? 'NT$' : ((CURRENCIES.find(x => x.code === c) || {}).symbol || (c ? c + ' ' : ''));
    const ntd = (v) => `NT$ ${Math.round(v).toLocaleString()}`;
    // 某成員在一筆支出中實際負擔的金額（TWD）
    function shareOfTWD(x, name) {
      const amt = (parseFloat(x.amount) || 0) * (rates[x.currency] || 1);
      const rate = rates[x.currency] || 1;
      const parts = (x.participants || []).map(String), payer = String(x.payer);
      if (x.splitMethod === '請客') return name === payer ? amt : 0;
      if (x.splitMethod === '自訂金額') return (parseFloat(x.customAmounts?.[name]) || 0) * rate;
      if (x.splitMethod === '代墊') { const o = parts.filter(p => p !== payer); return o.includes(name) ? amt / o.length : 0; }
      return parts.includes(name) && parts.length ? amt / parts.length : 0;
    }
    function renderRecSummary(list) {
      const total = list.reduce((s, x) => s + (parseFloat(x.amount) || 0) * (rates[x.currency] || 1), 0);
      $('recTotal').textContent = ntd(total);
      const curs = [...new Set(list.map(x => x.currency).filter(c => c && c !== 'TWD'))];
      $('recTotalSub').textContent = curs.length ? `含 ${curs.join('、')}，依帳本匯率換算${selectedMonth === 'all' ? '' : ' · 本月'}` : (selectedMonth === 'all' ? '' : '本月');
      $('recPeopleCount').textContent = `${people.length} 位旅伴`;
      const key = 'tm_me_' + activeTripId;
      let me = localStorage.getItem(key);
      if (!people.includes(me)) me = people[0] || '';
      $('recMe').innerHTML = people.length ? people.map(p => `<option value="${esc(p)}" ${p === me ? 'selected' : ''}>${esc(p)}</option>`).join('') : '<option value="">我</option>';
      $('recMine').textContent = ntd(me ? list.reduce((s, x) => s + shareOfTWD(x, me), 0) : 0);
      let pending = 0;
      try { const sc = $('settlementCurrency').value; pending = computeSettlement().reduce((s, t) => s + t.amount, 0) * (rates[sc] || 1); } catch (err) {}
      $('recPending').textContent = ntd(pending);
    }

    // ===== 結算轉帳（兩兩沖銷）=====
    function transfersCount() { try { return computeSettlement().length; } catch (e) { return 0; } }
    function computeSettlement() {
      const sumCur = $('settlementCurrency').value;
      const targetRate = rates[sumCur] || 1;
      const pairDebts = {};
      expenses.forEach(exp => {
        if (exp.splitMethod === '請客') return;
        const rate = rates[exp.currency] || 1;
        const amountTWD = (parseFloat(exp.amount) || 0) * rate;
        const payer = String(exp.payer);
        const parts = exp.participants || [];
        parts.forEach(p => {
          const pName = String(p);
          if (pName === payer) return;
          let share = 0;
          if (exp.splitMethod === '自訂金額') share = (parseFloat(exp.customAmounts?.[pName]) || 0) * rate;
          else if (exp.splitMethod === '代墊') { const others = parts.filter(i => String(i) !== payer); share = others.length ? amountTWD / others.length : 0; }
          else share = amountTWD / parts.length;
          if (share > 0) { if (!pairDebts[pName]) pairDebts[pName] = {}; pairDebts[pName][payer] = (pairDebts[pName][payer] || 0) + share; }
        });
      });
      const transfers = [];
      const seen = new Set();
      people.forEach(p1 => people.forEach(p2 => {
        if (p1 === p2) return;
        const key = [p1, p2].sort().join('::');
        if (seen.has(key)) return;
        seen.add(key);
        const a = (pairDebts[p1] && pairDebts[p1][p2]) || 0;
        const b = (pairDebts[p2] && pairDebts[p2][p1]) || 0;
        const diff = a - b;
        if (Math.abs(diff) > 0.01) {
          const from = diff > 0 ? p1 : p2;
          const to = diff > 0 ? p2 : p1;
          transfers.push({ from, to, amount: Math.abs(diff) / targetRate });
        }
      }));
      return transfers;
    }

    function getTransferDetails(from, to) {
      const sumCur = $('settlementCurrency').value;
      const targetRate = rates[sumCur] || 1;
      const details = [];
      expenses.forEach(exp => {
        if (exp.splitMethod === '請客') return;
        const payer = String(exp.payer);
        const parts = exp.participants || [];
        const rate = rates[exp.currency] || 1;
        const f = String(from), t = String(to);
        const shareOf = (name) => {
          if (exp.splitMethod === '自訂金額') return (parseFloat(exp.customAmounts?.[name]) || 0) * rate;
          if (exp.splitMethod === '代墊') { const others = parts.filter(p => String(p) !== payer); return others.length ? (exp.amount * rate) / others.length : 0; }
          return (exp.amount * rate) / parts.length;
        };
        if (payer === t && parts.includes(f)) { const s = shareOf(f); if (s > 0.01) details.push({ note: exp.note, amount: s / targetRate }); }
        if (payer === f && parts.includes(t)) { const s = shareOf(t); if (s > 0.01) details.push({ note: `(抵銷) ${exp.note}`, amount: -(s / targetRate) }); }
      });
      return details;
    }

        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 800;
          let w = img.width, h = img.height;
          if (w > max) { h *= max / w; w = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          previewUrl = canvas.toDataURL('image/jpeg', 0.6);

    async function analyzeReceipt(base64) {
      $('aiLoader').classList.remove('hidden');
      const prompt = '分析收據 JSON: { "merchant": "名稱", "amount": 數字, "currency": "TWD/JPY/USD...", "category": "類別", "date": "YYYY-MM-DD" }';
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: 'image/jpeg', data: base64 } }] }] })
        });
        const result = await res.json();
        const text = (result.candidates?.[0]?.content?.parts?.[0]?.text || '').replace(/```json|```/g, '');
        const data = JSON.parse(text);
        if (data.merchant) $('expNote').value = data.merchant;
        if (data.amount) $('expAmount').value = data.amount;
        if (data.currency && CURRENCIES.some(c => c.code === data.currency)) $('expCurrency').value = data.currency;
        if (data.category && CATEGORIES.includes(data.category)) $('expCategory').value = data.category;
        if (data.date) $('expDate').value = data.date;
        window.updateEstimate();
      } catch (err) { console.error('AI 辨識失敗', err); }
      finally { $('aiLoader').classList.add('hidden'); }

          : `<button onclick="window.openLodgingModal()" class="mt-2 text-sm font-bold text-[#627284] hover:text-[#527C9B]">${lodgings.length ? '這晚尚未安排住宿，點此設定' : '尚未新增住宿，點此新增'}</button>`}

      const tiles = [

    // 小萬年曆：只呈現當月
    function renderHomeCalendar() {
      if (!$('homeCalendar')) return;

      const daysInMonth = new Date(y, m + 1, 0).getDate();
      // 有記帳或行程的日子
      const marked = new Set();

      itinerary.forEach(i => { if (i.date) marked.add(i.date); });
      const pad = (n) => String(n).padStart(2, '0');
      const cells = [];

        const ds = `${y}-${pad(m + 1)}-${pad(d)}`;

        cells.push(`<div class="relative flex flex-col items-center justify-center aspect-square rounded-lg text-xs font-black ${isToday ? 'bg-blue-500 text-white shadow-sm' : weekend ? 'text-blue-400' : 'text-gray-600'}">

      $('homeCalendar').innerHTML = `
        <div class="bg-gray-50 rounded-2xl p-4">

            <span class="text-[10px] text-gray-400 font-bold flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>有紀錄</span>
          </div>
          <div class="grid grid-cols-7 gap-1 mb-1">
            ${['日','一','二','三','四','五','六'].map((w, i) => `<div class="text-center text-[10px] font-black ${i === 0 || i === 6 ? 'text-blue-300' : 'text-gray-300'}">${w}</div>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
        </div>`;
      icons();

    // ===== 天氣（Open-Meteo，免金鑰）=====
    function wmo(code) {
      if (code === 0) return { icon: 'sun', label: '晴' };
      if (code <= 2) return { icon: 'cloud-sun', label: '多雲時晴' };
      if (code === 3) return { icon: 'cloud', label: '陰' };
      if (code <= 48) return { icon: 'cloud-fog', label: '霧' };
      if (code <= 57) return { icon: 'cloud-drizzle', label: '毛毛雨' };
      if (code <= 67) return { icon: 'cloud-rain', label: '雨' };
      if (code <= 77) return { icon: 'snowflake', label: '雪' };
      if (code <= 82) return { icon: 'cloud-rain', label: '陣雨' };
      if (code <= 86) return { icon: 'snowflake', label: '陣雪' };
      return { icon: 'cloud-lightning', label: '雷雨' };
    }
    async function fetchWeather() {
      const box = $('homeWeather');
      let lat = tripMeta.destLat, lng = tripMeta.destLng;
      if ((lat == null || lng == null) && tripMeta.destination) {
        const g = await geocode(tripMeta.destination);
        if (g) { lat = g.lat; lng = g.lng; }
      }
      if (lat == null || lng == null) { box.innerHTML = ''; return; }
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
        const r = await fetch(url);
        const d = await r.json();
        const cur = wmo(d.current.weather_code);
        box.innerHTML = `<div class="flex items-center justify-end gap-1.5"><i data-lucide="${cur.icon}" class="w-5 h-5 text-[#3F8A9E]"></i><span class="text-2xl font-black">${Math.round(d.current.temperature_2m)}°C</span></div><div class="text-[11px] font-bold text-[#556576] mt-0.5">${esc((tripMeta.destination || '').split(/[・·,，\s]/)[0])} · ${cur.label}</div><div class="text-[10px] font-bold text-[#627284]">${Math.round(d.daily.temperature_2m_min[0])}° / ${Math.round(d.daily.temperature_2m_max[0])}°</div>`;
        icons();
      } catch (err) { console.warn('天氣載入失敗', err); box.innerHTML = ''; }
    }

    // ===== 行程（時間軸 + 住宿色帶 + 高亮今天）=====
    function lodgingForDate(dateStr) {
      const lodgings = tripMeta.lodgings || [];
      for (const l of lodgings) {
        if (!l.checkin || !l.nights) continue;
        const diff = daysBetween(l.checkin, dateStr);
        if (diff >= 0 && diff < l.nights) return { ...l, night: diff + 1, _idx: lodgings.indexOf(l) };
      }
      return null;
    }
    // ===== 行經時間自動計算 =====
    const TRAVEL_MODES = {
      walk: { label: '步行', icon: 'footprints', gm: 'walking', osrm: 'routed-foot' },
      transit: { label: '大眾運輸', icon: 'train-front', gm: 'transit', osrm: null },
      car: { label: '開車／計程車', icon: 'car', gm: 'driving', osrm: 'routed-car' },
      charter: { label: '包車', icon: 'bus', gm: 'driving', osrm: 'routed-car' }
    };
    const MODE_OPTS = (v) => [['auto', '自動判斷'], ...Object.entries(TRAVEL_MODES).map(([k, m]) => [k, m.label])].map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('');
    const ROUTE_KEY = 'tm_route_cache_v1';
    let routeCache = {};
    try { routeCache = JSON.parse(localStorage.getItem(ROUTE_KEY) || '{}'); } catch (e) { routeCache = {}; }
    const hasGeo = (p) => p && typeof p.lat === 'number' && typeof p.lng === 'number' && !(p.lat === 0 && p.lng === 0);
    function haversineKm(a, b) {
      const R = 6371, r = (d) => d * Math.PI / 180;
      const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const pickMode = (m, km) => (m && TRAVEL_MODES[m]) ? m : TRAVEL_MODES[tripMeta.defaultTransport] ? tripMeta.defaultTransport : (km <= 1.2 ? 'walk' : 'transit');
    function estimateMin(mode, km) {
      if (mode === 'walk') return Math.max(1, Math.round(km * 1.25 / 4.5 * 60));
      if (mode === 'car' || mode === 'charter') return Math.max(3, Math.round(km * 1.4 / 35 * 60 + 3));
      return Math.max(5, Math.round(km * 1.3 / 28 * 60 + 10));
    }
    const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)} 小時${m % 60 ? ' ' + (m % 60) + ' 分' : ''}` : `${m} 分鐘`;
    const fmtKm = (k) => k < 1 ? `${Math.round(k * 1000)} m` : `${k.toFixed(1)} km`;
    const toMinOfDay = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
    const legKey = (mode, a, b) => `${mode}|${a.lat.toFixed(5)},${a.lng.toFixed(5)}|${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
    function legText(mode, min, km, approx) { return `${TRAVEL_MODES[mode].label} ${approx ? '約 ' : ''}${fmtMin(min)} · ${fmtKm(km)}`; }
    function legWarn(gap, min) { return gap != null && gap < min ? `前往此站可能需要更多時間：交通約 ${fmtMin(min)}，僅預留 ${fmtMin(Math.max(gap, 0))}` : ''; }
    function travelLeg(prev, cur) {
      if (!hasGeo(prev) || !hasGeo(cur)) return (prev.location && cur.location) ? `<div class="flex items-center gap-1.5 pl-[4.25rem] py-2 text-[11px] font-bold text-[#556576]"><i data-lucide="route" class="w-3.5 h-3.5"></i>交通時間待確認</div>` : '';
      const km0 = haversineKm(prev, cur);
      if (km0 < 0.03) return '';
      const mode = pickMode(cur.transport, km0);
      const key = legKey(mode, prev, cur);
      const hit = routeCache[key];
      const min = hit ? hit.min : estimateMin(mode, km0);
      const km = hit ? hit.km : km0;
      const a0 = toMinOfDay(prev.time), a = a0 == null ? null : a0 + (+prev.duration || 0), b = toMinOfDay(cur.time);
      const gap = a != null && b != null ? b - a : null;
      const warn = legWarn(gap, min);
      const gm = `https://www.google.com/maps/dir/?api=1&origin=${prev.lat},${prev.lng}&destination=${cur.lat},${cur.lng}&travelmode=${TRAVEL_MODES[mode].gm}`;
      const pending = !hit && TRAVEL_MODES[mode].osrm;
      return `<div class="travel-leg" data-key="${esc(key)}" data-gap="${gap == null ? '' : gap}" ${pending ? 'data-pending="1"' : ''}>
        <div class="flex items-center gap-1.5 pl-[4.25rem] py-2 text-[11px] font-bold text-[#556576]">
          <i data-lucide="${TRAVEL_MODES[mode].icon}" class="w-3.5 h-3.5 shrink-0"></i>
          <span class="leg-text truncate min-w-0">${legText(mode, min, km, !hit || mode === 'transit')}</span>
          ${cur._flight ? '' : `<select onclick="event.stopPropagation()" onchange="window.setLegMode('${esc(cur.dbId)}', this.value, ${cur._spend ? 1 : 0})" title="更改這段交通方式" class="shrink-0 max-w-[5.5rem] bg-transparent border border-[#DFE3E8] rounded-full px-1.5 py-0.5 text-[11px] font-bold text-[#556576] outline-none cursor-pointer">${MODE_OPTS(TRAVEL_MODES[cur.transport] ? cur.transport : 'auto')}</select>`}
          <a href="${gm}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="ml-auto shrink-0 whitespace-nowrap px-2 py-0.5 rounded-full border border-[#DFE3E8] text-[#527C9B] hover:bg-[#E3EBF2]">路線</a>
        </div>
        <div class="leg-warn ml-[4.25rem] mb-2 px-2.5 py-1 rounded-lg bg-[#F8EEDF] text-[#8E5F22] text-[11px] font-bold" ${warn ? '' : 'x-hidden'}>${warn}</div>
      </div>`;
    }
    let legsRunning = false;
    async function fillTravelLegs() {
      if (legsRunning) return;
      legsRunning = true;
      try {
        let el;
        while ((el = document.querySelector('.travel-leg[data-pending]'))) {
          el.removeAttribute('data-pending');
          const key = el.dataset.key;
          const [mode, a, b] = key.split('|');
          if (!routeCache[key]) {
            const [aLat, aLng] = a.split(',').map(Number), [bLat, bLng] = b.split(',').map(Number);
            try {
              const r = await fetch(`https://routing.openstreetmap.de/${TRAVEL_MODES[mode].osrm}/route/v1/driving/${aLng},${aLat};${bLng},${bLat}?overview=false`);
              const j = await r.json();
              if (j.code === 'Ok' && j.routes && j.routes[0]) {
                routeCache[key] = { min: Math.max(1, Math.round(j.routes[0].duration / 60)), km: j.routes[0].distance / 1000 };
                try { localStorage.setItem(ROUTE_KEY, JSON.stringify(routeCache)); } catch (e) {}
              }
            } catch (e) { console.warn('路線計算失敗，使用估算值', e); }
            await new Promise(res => setTimeout(res, 300));
          }
          const hit = routeCache[key];
          if (!hit) continue;
          document.querySelectorAll(`.travel-leg[data-key="${CSS.escape(key)}"]`).forEach(node => {
            node.removeAttribute('data-pending');
            node.querySelector('.leg-text').textContent = legText(mode, hit.min, hit.km, false);
            const g = node.dataset.gap === '' ? null : +node.dataset.gap;
            const w = legWarn(g, hit.min), wEl = node.querySelector('.leg-warn');
            wEl.textContent = w;
            if (w) wEl.removeAttribute('x-hidden'); else wEl.setAttribute('x-hidden', '');
          });
        }
      } finally { legsRunning = false; }
    }

    let selectedItinDate = null;
    let itinDates = [];
    window.selectItinDate = (d) => { selectedItinDate = d; renderItinerary(); };
    window.itinWeek = (delta) => {
      const page = Math.floor(itinDates.indexOf(selectedItinDate) / 7) + delta;
      const first = itinDates[page * 7];
      if (!first) return;
      const t = todayStr(), wk = itinDates.slice(page * 7, page * 7 + 7);
      selectedItinDate = wk.includes(t) ? t : first;
      renderItinerary();
    };
    const hhmm = (m) => `${String(Math.floor(((m % 1440) + 1440) % 1440 / 60)).padStart(2, '0')}:${String(((m % 60) + 60) % 60).padStart(2, '0')}`;
    function itinDayItems(date) {
      const a = itinerary.filter(i => i.date === date).map(i => ({ ...i, _spend: false }));
      const b = expenses.filter(e => e.scheduleTime && e.date === date).map(e => ({ _spend: true, dbId: e.dbId, time: e.scheduleTime, title: e.note, amount: e.amount, currency: e.currency, location: e.location, category: e.category, lat: e.lat, lng: e.lng, transport: e.transport }));
      const k = (x) => { const m = toMinOfDay(x.time); return m == null ? 99999 : m; };
      const c = uniqueFlights().filter(f => f.date === date).map(f => {
        const d0 = toMinOfDay(f.depTime), a0 = toMinOfDay(f.arrTime);
        const dur = d0 != null && a0 != null ? ((a0 - d0) + 1440) % 1440 : null;
        return { _flight: true, dbId: f.dbId, time: f.depTime || '', duration: dur, title: `${f.number || '航班'} ${f.fromCode || ''} → ${f.toCode || ''}`,
          sub: ['航班', f.airline, f.arrTime ? `抵達 ${f.arrTime}${dur != null && a0 < d0 ? '（+1）' : ''}` : '', f.pnr ? `訂位 ${f.pnr}` : ''].filter(Boolean).join(' · '), note: f.note };
      });
      return [...a, ...b, ...c].sort((x, y) => k(x) - k(y));
    }
    function renderItinerary() {
      const set = new Set(itinerary.map(i => i.date).filter(Boolean));
      expenses.forEach(e => { if (e.scheduleTime && e.date) set.add(e.date); });
      flights.forEach(f => { if (f.date) set.add(f.date); });
      if (tripMeta.startDate && tripMeta.endDate) {
        const n = daysBetween(tripMeta.startDate, tripMeta.endDate);
        for (let i = 0; i <= n && i < 120; i++) set.add(addDays(tripMeta.startDate, i));
      }
      const dates = [...set].sort();
      const t = todayStr();
      const trip = trips.find(x => x.id === activeTripId);
      const tripName = (trip && trip.name) || tripMeta.destination || '我的旅程';

      if (!dates.length) {
        $('itinCountdown').innerHTML = '';
        $('itineraryList').innerHTML = `<div class="text-center py-20 text-gray-300 font-bold bg-white rounded-2xl border border-gray-50"><i data-lucide="calendar-days" class="w-10 h-10 mx-auto mb-2 opacity-20"></i><p>尚無行程，點右上「新增行程」<br/>或到旅程設定填入日期</p></div>`;
        icons(); return;
      }
      if (!selectedItinDate || !dates.includes(selectedItinDate)) selectedItinDate = dates.includes(t) ? t : dates[0];
      const sel = selectedItinDate;
      const sd = dObj(sel);
      const pages = Math.ceil(dates.length / 7);
      const page = Math.floor(dates.indexOf(sel) / 7);
      const week = dates.slice(page * 7, page * 7 + 7);
      itinDates = dates;
      const md = (d) => { const o = dObj(d); return `${o.getMonth() + 1}/${o.getDate()}`; };
      const dayN = tripMeta.startDate ? daysBetween(tripMeta.startDate, sel) + 1 : null;
      const toStart = tripMeta.startDate ? daysBetween(t, tripMeta.startDate) : null;
      const ended = tripMeta.endDate && daysBetween(tripMeta.endDate, t) > 0;
      const status = toStart == null ? '' : toStart > 0 ? `出發倒數 ${toStart} 天` : ended ? '旅程已結束' : '旅程進行中';

      $('itinCountdown').innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-[#DFE3E8] p-4 space-y-4">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="text-[10px] font-bold tracking-wider text-[#556576]">TRIP MONEY · ITINERARY</div>
            <div class="text-lg font-black text-[#293C4E] truncate">${esc(tripName)}</div>
            <div class="text-xs font-bold text-[#556576]">${sd.getMonth() + 1}月${sd.getDate()}日${dayN && dayN > 0 ? ' · DAY ' + dayN : ''}</div>
          </div>
          ${status ? `<span class="shrink-0 text-[11px] font-black px-2.5 py-1 rounded-full bg-[#E3EBF2] text-[#527C9B]">${status}</span>` : ''}
        </div>
        <label class="flex items-center gap-2 text-xs font-bold text-[#556576]"><i data-lucide="route" class="w-3.5 h-3.5"></i>本旅程主要交通
          <select onchange="window.setDefaultTransport(this.value)" class="ml-auto bg-[#EEF1F4] border border-[#DFE3E8] rounded-lg px-2 py-1 font-bold text-[#293C4E] outline-none cursor-pointer">${MODE_OPTS(TRAVEL_MODES[tripMeta.defaultTransport] ? tripMeta.defaultTransport : 'auto')}</select>
        </label>
        <div class="space-y-2">
          <div class="flex items-center gap-2">
            <button onclick="window.itinWeek(-1)" ${page > 0 ? '' : 'disabled'} title="上一週" class="w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-[#527C9B] hover:bg-[#E3EBF2] disabled:text-[#C3CBD4] disabled:hover:bg-transparent"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <div class="flex-1 text-center text-xs font-black text-[#293C4E]">${pages > 1 ? `第 ${page + 1} 週 · ` : ''}${md(week[0])} – ${md(week[week.length - 1])}<span class="text-[#556576] font-bold">${pages > 1 ? `（共 ${pages} 週）` : ''}</span></div>
            <button onclick="window.itinWeek(1)" ${page < pages - 1 ? '' : 'disabled'} title="下一週" class="w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-[#527C9B] hover:bg-[#E3EBF2] disabled:text-[#C3CBD4] disabled:hover:bg-transparent"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
          <div class="grid grid-cols-7 gap-1">
            ${week.map(d => {

    async function loadLiveRates(force) {
